<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale:1" />
    <title>Reproducción automática de video</title>
    <style>
        /* Ajustes básicos para que el video ocupe toda la página */
        html,body { height:100%; margin:0; background:#000; }
        video { width:100%; height:100%; object-fit:cover; display:block; }

        /* Overlay para botón de fallback */
        #overlay {
            position:fixed;
            inset:0;
            display:flex;
            align-items:center;
            justify-content:center;
            pointer-events:none; /* no bloquear clicks en vídeo cuando oculto */
        }
        #playBtn {
            pointer-events:auto;
            background:rgba(0,0,0,0.6);
            color:#fff;
            border:1px solid rgba(255,255,255,0.2);
            padding:0.6rem 1rem;
            border-radius:6px;
            font-size:1rem;
            cursor:pointer;
        }
        #playBtn.hidden { display:none; }
    </style>
</head>
<body>
    <!-- IMPORTANTE: reemplaza `video.mp4` por la ruta correcta a tu archivo local (p. ej. "videos/mi-video.mp4").
         Esta versión requiere un clic del usuario para iniciar la reproducción con audio. -->
    <video id="autoVideo" playsinline loop preload="auto">
        <source src="ZXJyb3I=.mp4" type="video/mp4">
        Tu navegador no soporta el elemento <code>video</code>.
    </video>

    <!-- Overlay con botón: pedimos interacción explícita para reproducir con audio -->
    <div id="overlay">
        <button id="playBtn">Reproducir vídeo (con audio)</button>
    </div>

    <script>
        const v = document.getElementById('autoVideo');
        const overlay = document.getElementById('overlay');
        const playBtn = document.getElementById('playBtn');

        // Mostrar el botón al cargar y esperar interacción del usuario.
        function showPlayButton() {
            playBtn.classList.remove('hidden');
            overlay.style.pointerEvents = 'auto';
        }

        // Al hacer clic: desmutear (por si estaba muteado por el sistema), reproducir y ocultar overlay.
        playBtn.addEventListener('click', async () => {
            try {
                v.muted = false;
                await v.play();
                playBtn.classList.add('hidden');
                overlay.style.pointerEvents = 'none';
            } catch (err) {
                console.error('No se pudo reproducir con audio:', err);
            }
        });

        // También permitir que el usuario haga click directamente en el vídeo para iniciar con audio.
        v.addEventListener('click', async () => {
            if (v.paused) {
                try {
                    v.muted = false;
                    await v.play();
                    playBtn.classList.add('hidden');
                    overlay.style.pointerEvents = 'none';
                } catch (err) {
                    console.error('Error al reproducir al hacer clic en el vídeo:', err);
                }
            }
        });

        // Mostrar el botón al cargar la página.
        window.addEventListener('load', showPlayButton);
    </script>
</body>
</html>
